title: FluxMint Digital
description: Home office setups, remote work gear, and productivity guides for professionals working from home.
url: "https://fluxmintdigital.github.io"
baseurl: ""

author:
  name: FluxMint Digital

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Pagination
paginate: 10
paginate_path: "/page/:num/"

# SEO
twitter:
  username: fluxmintdigital
social:
  name: FluxMint Digital

# Collections
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "FluxMint Digital"
